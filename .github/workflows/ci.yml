# CI for psi-briefing.
#
# Part of the psi-briefing toolchain (MIT - see LICENSE).
#
# Every check below stands for a fault that actually cost this project time.
# Nothing here is defensive decoration; if a step looks cheap, that is because
# the fault it catches was cheap to catch and expensive to miss.
#
# There is deliberately no install step. package.json exists, but only for
# metadata and script aliases: the framework has no dependencies and no
# lockfile, so `npm ci` would fail - and adding a lockfile purely to satisfy a
# CI convention would contradict the one property the project is built on.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  toolchain:
    name: Deck toolchain
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 20 rather than "latest": the tools state node 18+ as their floor, and a
      # pinned LTS keeps a runner-side node upgrade from being indistinguishable
      # from a real regression. No cache: there is nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The repository keeps duplicate copies of framework/briefing.{css,js},
      # themes/*.css and docs/cookbook.md so that skills/briefing/ is
      # self-contained. Copies drift silently, and the drift is not a cosmetic
      # problem: a deck that links a stale copy shows the OLD behaviour, so you
      # end up debugging the change instead of the copy. That cost two rounds of
      # debugging while .cols--figure was being added. This step is first because
      # a stale copy invalidates the reasoning behind every check after it.
      #
      # test-aufsicht/ is gitignored and therefore absent here; the script
      # already treats a missing copy as "nothing to compare", not as drift.
      - name: Duplicated copies are in step with their originals
        run: tools/sync-assets.sh --check

      # md-to-deck.mjs writes its report to stderr and only exits non-zero on
      # hard errors, so "exit 0" alone does not prove it produced a deck. The
      # section count is the cheapest assertion that it emitted slides rather
      # than a well-formed empty page.
      #
      # Both example decks go through it. The tutorial matters more than its slide
      # count suggests: it is the only deck that exercises the raw-HTML escape
      # hatch, fenced code inside a directive, and a nested chart directive, and
      # all three have broken at least once. A converter change that silently
      # loses half the tutorial's slides is exactly the failure this catches - it
      # happened, when a raw HTML block ending flush against a `:::` line ate the
      # fence terminator and the deck built 6 slides instead of 15.
      - name: Markdown converter still produces a deck
        run: |
          fail=0
          for src in examples/example-deck.md examples/tutorial.md; do
            out="${src%.md}-ci.html"
            node tools/md-to-deck.mjs "$src" -o "$out"
            slides="$(grep -c '<section class="frame"' "$out")"
            echo "$src -> $slides slide(s)"
            # A deck that loses most of its slides still exits 0, so assert a
            # floor rather than merely "more than one".
            if [ "$slides" -lt 10 ]; then
              echo "$src: expected at least 10 slides, got $slides" >&2
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          # The pipeline steps below expect these names.
          cp examples/example-deck-ci.html examples/example-deck-md.html
          cp examples/tutorial-ci.html examples/tutorial.html

      # The central promise is "one file, no network". build-deck.sh ends in a
      # verify step that asserts nothing external is left, and that verify step
      # was silently broken for months: it blanked whole <script> elements
      # instead of just their content, which destroyed the src attribute it was
      # supposed to inspect, so a deck loading a remote script passed. Asserting
      # exit 0 here is what keeps that from happening unnoticed again.
      #
      # Exit codes: 0 built and verified, 1 usage/input error, 2 built but still
      # depends on something external. Only 0 is acceptable.
      #
      # A bare runner has neither cwebp nor magick, so stage 1 warns and skips
      # the image re-encoding. That is a size optimisation, not a correctness
      # step, and the script is explicit that it still produces a valid file -
      # so the missing encoder must not be treated as a failure.
      - name: Hand-built example deck builds self-contained
        run: tools/build-deck.sh examples/example-deck.html -o build/example-deck.html

      # Run the pipeline on the converted deck too, not only on the hand-built
      # one: the converter emits its own markup, and a change there can produce
      # a deck that renders but no longer inlines cleanly. Both paths into the
      # pipeline have to stay buildable.
      - name: Converted decks build self-contained
        run: |
          tools/build-deck.sh examples/example-deck-md.html -o build/example-deck-md.html
          tools/build-deck.sh examples/tutorial.html -o build/tutorial.html

      # The two language versions of the landing page are separate files, not a
      # template with two data files, so nothing stops a section being added to
      # one and forgotten in the other. The failure is silent: both pages render,
      # and the German reader simply never learns the thing. Anchors are checked
      # rather than prose because they are the part that must match exactly: the
      # language switch keeps the reader's position only if both pages carry the
      # same ids, and every #link in either page resolves against both.
      - name: Landing page translations have the same sections
        run: |
          ids() { grep -o 'id="[a-z-]*"' "$1" | sort -u; }
          if ! diff <(ids docs/site/index.html) <(ids docs/site/index.de.html); then
            echo "::error::docs/site/index.html and index.de.html have drifted apart."
            echo "Lines with < are English only, lines with > are German only."
            exit 1
          fi
          for f in docs/site/index.html docs/site/index.de.html; do
            h2=$(grep -c '<h2>' "$f")
            nav=$(sed -n '/topbar-panel/,/<\/ol>/p' "$f" | grep -c '<li>')
            echo "$f: $h2 headings, $nav contents entries"
            [ "$h2" = "$nav" ] || { echo "::error::$f: contents menu and headings disagree"; exit 1; }
          done

  # ---------------------------------------------------------------------------
  # Separate job on purpose. A failing step aborts the rest of its job, and the
  # naming sweep must not be able to hide a broken build (or the reverse).
  naming:
    name: Old name does not creep back
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The project was renamed browserslides -> psi-briefing for its first
      # public release. Renames leak back in through copy-pasted snippets,
      # generated files that were regenerated from an old template, and the
      # duplicated skill assets above. This grep is the whole guard.
      #
      # window.Browserslides was the old runtime global and bs-hyphens /
      # bs-nohyphens / bs-hyphenate / bs-equalised the old class prefix; both
      # are already gone, so any hit is a regression rather than leftover work.
      #
      # Two paths are excluded, and only two, because both have to spell the old
      # name to do their job:
      #
      #   CHANGELOG.md   tells a reader who knew the project under the old name
      #                  that this is the same thing.
      #   this file      states the pattern it greps for, and explains it.
      #
      # The second exclusion was not in the first version, and the guard could
      # therefore never pass: git grep searches tracked files, this workflow is
      # tracked, and it names the old spelling five times. It appeared to pass
      # only while it was still untracked - a check that has never once run
      # against its own repository looks exactly like a check that passes.
      #
      # Excluding this file does blind the guard to the file most likely to gain
      # a copy-pasted snippet. Accepted, because the alternative - assembling the
      # pattern from fragments so it does not appear literally - would not help:
      # the prose above would still contain the old name, and the guard would
      # still match it. The honest options were "exclude it" or "never write the
      # old name here", and vaguer comments are the worse trade in this codebase.
      #
      # Nothing else is excluded. docs/handoff-autolayout.md, for instance, is
      # not: it named the framework in ordinary prose, which is exactly the thing
      # that should have been renamed, and was.
      - name: No tracked file mentions the old name
        run: |
          if git grep -nE 'browserslides|window\.Browserslides|bs-hyphens|bs-nohyphens|bs-hyphenate|bs-equalised' \
               -- ':!CHANGELOG.md' ':!.github/workflows/ci.yml'; then
            echo >&2
            echo "The lines above still carry the pre-rename name." >&2
            echo "Rename them to psi-briefing / briefing before merging." >&2
            exit 1
          fi
          echo "no occurrences of the old name"
